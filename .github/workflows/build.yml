name: Build plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify artifacts (pull request)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build artifacts are stale. Run npm run build and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Commit build artifacts (main)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/*/index.js plugins/*/manifest.json plugins.json docs/plugins.json docs/roadmap.json docs/analysis.json ANALYSIS.md upstream.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: rebuild plugins [skip build]"
            git push
          fi
